name: bridgeai

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: thriveward-funding-intelligence-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-bridge_ai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge_admin} -d ${POSTGRES_DB:-bridge_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: thriveward-funding-intelligence-api-migrate:latest
    container_name: thriveward-funding-intelligence-api-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL environment variable is required}
    command: ["sh", "-c", "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx prisma db execute --file=apps/api/prisma/runtime-grants.sql --schema=apps/api/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: thriveward-funding-intelligence-api:latest
    container_name: thriveward-funding-intelligence-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?RUNTIME_DATABASE_URL environment variable is required}
      FUNDING_AGENT_URL: http://funding-agent:8000
      AI_FUNDING_ANALYST_ENABLED: ${AI_FUNDING_ANALYST_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2500}
      AI_EVALUATION_RATE_LIMIT_PER_HOUR: ${AI_EVALUATION_RATE_LIMIT_PER_HOUR:-5}
      AI_DOCUMENT_GROUNDING_ENABLED: ${AI_DOCUMENT_GROUNDING_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_EMBEDDING_TIMEOUT_MS: ${OPENAI_EMBEDDING_TIMEOUT_MS:-30000}
      DOCUMENT_EMBEDDING_BATCH_SIZE: ${DOCUMENT_EMBEDDING_BATCH_SIZE:-32}
      DOCUMENT_CHUNK_TARGET_TOKENS: ${DOCUMENT_CHUNK_TARGET_TOKENS:-500}
      DOCUMENT_CHUNK_OVERLAP_TOKENS: ${DOCUMENT_CHUNK_OVERLAP_TOKENS:-75}
      DOCUMENT_RETRIEVAL_TOP_K: ${DOCUMENT_RETRIEVAL_TOP_K:-8}
      DOCUMENT_RETRIEVAL_MAX_CONTEXT_TOKENS: ${DOCUMENT_RETRIEVAL_MAX_CONTEXT_TOKENS:-6000}
      DOCUMENT_INGESTION_ENABLED: ${DOCUMENT_INGESTION_ENABLED:-false}
      DOCUMENT_STORAGE_ROOT: ${DOCUMENT_STORAGE_ROOT:-/data/funding-documents}
      DOCUMENT_MAX_FILE_BYTES: ${DOCUMENT_MAX_FILE_BYTES:-26214400}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-300}
      DOCUMENT_EXTRACTION_TIMEOUT_MS: ${DOCUMENT_EXTRACTION_TIMEOUT_MS:-30000}
      DOCUMENT_EXTRACTION_VERSION: ${DOCUMENT_EXTRACTION_VERSION:-pdf-page-text-v1}
    volumes:
      - funding_documents:/data/funding-documents
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  funding-agent:
    build:
      context: ./services/funding-agent
    image: thriveward-funding-intelligence-funding-agent:latest
    container_name: thriveward-funding-intelligence-funding-agent
    restart: unless-stopped
    ports:
      - "${PYTHON_AGENT_PORT:-8000}:8000"
    environment:
      PORT: 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: thriveward-funding-intelligence-web:latest
    container_name: thriveward-funding-intelligence-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
    external: true
    name: bridgeai_postgres_data
  funding_documents:
    name: thriveward_funding_intelligence_documents
